<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shelf Defense</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background: #2c1a04;
            font-family: 'Courier New', Courier, monospace;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #game-container {
            width: 800px;
            height: 500px;
            background: #4a3511;
            border: 8px solid #8B5A2B;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        #ui-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 50px;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            font-size: 18px;
            font-weight: bold;
            z-index: 10;
            border-bottom: 3px solid #8B5A2B;
        }
        .meter-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .meter {
            width: 150px;
            height: 15px;
            background: #333;
            border: 2px solid #fff;
            border-radius: 3px;
            overflow: hidden;
        }
        #noise-fill {
            width: 0%;
            height: 100%;
            background: #ff4757;
            transition: width 0.2s;
        }
        #librarian {
            width: 50px;
            height: 70px;
            background: #1e90ff;
            border: 3px solid #fff;
            border-radius: 5px;
            position: absolute;
            bottom: 20px;
            left: 375px;
            transition: left 0.1s linear;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
        }
        .kid {
            width: 40px;
            height: 50px;
            background: #ff4757;
            border: 2px solid #fff;
            border-radius: 5px;
            position: absolute;
            bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
        }
        .book {
            width: 30px;
            height: 40px;
            background: #ffa500;
            border: 2px solid #fff;
            border-radius: 3px;
            position: absolute;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            font-weight: bold;
        }
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            text-align: center;
        }
        h1 {
            font-size: 48px;
            color: #ffa500;
            margin-bottom: 10px;
            text-shadow: 2px 2px #000;
        }
        p {
            font-size: 18px;
            max-width: 500px;
            margin-bottom: 30px;
            line-height: 1.5;
        }
        button {
            padding: 12px 30px;
            font-size: 20px;
            font-family: inherit;
            background: #2ed573;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 5px #26af5f;
        }
        button:active {
            transform: translateY(4px);
            box-shadow: 0 1px #26af5f;
        }
        .hidden {
            display: none !important;
        }
        #floor {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 20px;
            background: #8B5A2B;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="ui-bar">
            <div>SCORE: <span id="score-val">0</span></div>
            <div class="meter-container">
                <span>CHAOS:</span>
                <div class="meter"><div id="noise-fill"></div></div>
            </div>
        </div>

        <div id="floor"></div>
        <div id="librarian">🧙‍♂️</div>

        <div id="start-screen" class="screen">
            <h1>SHELF DEFENSE</h1>
            <p>Rowdy kids are tossing books! <br>Move with <b>LEFT / RIGHT arrows</b> or <b>A / D keys</b>.<br>Catch books before they hit the floor. Shush the kids by running into them!</p>
            <button id="start-btn">START GAME</button>
        </div>

        <div id="game-over-screen" class="screen hidden">
            <h1>GAME OVER</h1>
            <p>The library dissolved into pure chaos!</p>
            <p>Your Final Score: <span id="final-score">0</span></p>
            <button id="restart-btn">TRY AGAIN</button>
        </div>
    </div>

    <script src="Shelf defense.js"></script>
</body>
</html>
